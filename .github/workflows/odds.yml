name: odds-collector
on:
  push:
    paths: ['request.json', '.github/workflows/odds.yml', 'collect.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency: odds
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Collect odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDSKEY: ${{ secrets.ODDSKEY }}
          ODDSAPI: ${{ secrets.ODDSAPI }}
        run: python collect.py
      - name: Commit
        run: |
          git config user.name "odds-bot"
          git config user.email "odds-bot@users.noreply.github.com"
          git add -A odds
          git diff --cached --quiet && exit 0
          git commit -m "odds $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs -q && git push && exit 0; sleep 7; done; exit 1
