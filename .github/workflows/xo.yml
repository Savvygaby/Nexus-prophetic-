name: xo-snapshot
on:
  workflow_dispatch:
  push:
    paths: ['xo_request.json']
  schedule:
    - cron: '23 14 * * *'           # daily: capture XO's picks before games, recap after
    - cron: '23 6 * * *'
permissions:
  contents: write
concurrency: xo
jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q playwright && python -m playwright install --with-deps chromium
      - run: python collect_xo.py
        continue-on-error: true
      - name: Commit
        if: always()
        run: |
          git config user.name "logs-bot"
          git config user.email "logs-bot@users.noreply.github.com"
          git add logs
          git diff --cached --quiet || git commit -q -m "xo $(date -u +%Y%m%dT%H%MZ)"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 7; done
