name: market-news-logs
on:
  schedule:
    - cron: '17 */3 * * *'          # every 3 hours, all week (splits, ESPN injuries/news)
    - cron: '47 15,16,17 * * 0'      # Sunday: before inactives / 1pm kickoffs
  workflow_dispatch:
permissions:
  contents: write
concurrency: logs
jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Snapshot splits, injuries, news
        run: python collect_logs.py
        continue-on-error: true
      - name: Commit
        if: always()
        run: |
          git config user.name "logs-bot"
          git config user.email "logs-bot@users.noreply.github.com"
          git add logs
          git diff --cached --quiet || git commit -q -m "logs $(date -u +%Y%m%dT%H%MZ)"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 7; done
