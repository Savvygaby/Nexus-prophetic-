name: nflverse-pull
on:
  workflow_dispatch:
  push:
    paths: ['collect_nflverse.py']
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q pandas pyarrow
      - run: python collect_nflverse.py
      - name: Commit
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add nflverse
          git diff --cached --quiet || git commit -q -m "nflverse pull $(date -u +%Y%m%dT%H%MZ)"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 7; done
