name: nflverse-pull
on:
  workflow_dispatch:
  push:
    paths: ['collect_nflverse.py']
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q pandas pyarrow
      - run: python collect_nflverse.py
      - name: Push to data branch
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          mkdir -p /tmp/nv && cp -r nflverse /tmp/nv/
          git checkout --orphan data-tmp
          git rm -rq --cached . 
          git add -f /dev/null 2>/dev/null || true
          cd /tmp/nv && git init -q && git checkout -q -b data && git add nflverse && git -c user.name=data-bot -c user.email=data-bot@users.noreply.github.com commit -qm "nflverse $(date -u +%Y%m%d)"
          git push -fq "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
