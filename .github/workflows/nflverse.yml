name: nflverse-pull
on:
  schedule:
    - cron: '17 13 * * 2'      # Tuesdays 9:17am ET: weekly snaps/participation/injuries/depth refresh
    - cron: '47 21 * * 5'      # Fridays 5:47pm ET: final injury report
    - cron: '7 14 * * 0'       # Sundays 10:07am ET: inactives-day injury refresh before the 11:20 re-price
  workflow_dispatch:
  push:
    paths: ['collect_nflverse.py']
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q pandas pyarrow
      - run: python collect_nflverse.py
      - name: Push to data branch
        run: |
          ls -la nflverse | sort -k5 -n | tail -8
          find nflverse -size +95M -print -delete
          mkdir -p /tmp/nv && cp -r nflverse /tmp/nv/ && cd /tmp/nv
          git init -q && git checkout -q -b data
          git add nflverse && git -c user.name=data-bot -c user.email=data-bot@users.noreply.github.com commit -qm "nflverse $(date -u +%Y%m%d)"
          git push -fq "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
