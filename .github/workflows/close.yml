name: kickoff-close-capture
on:
  schedule:
    - cron: '*/15 * * * *'      # checks the free events list; only spends credits when a game is 20-75 min from start
  workflow_dispatch:
permissions:
  contents: write
concurrency: close
jobs:
  cap:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python close_capture.py
        env:
          ODDSAPI: ${{ secrets.ODDSAPI }}
      - name: Commit
        run: |
          git config user.name "close-bot"
          git config user.email "close-bot@users.noreply.github.com"
          git add odds/close 2>/dev/null || true
          git diff --cached --quiet || git commit -q -m "close capture $(date -u +%Y%m%dT%H%MZ)"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 7; done
