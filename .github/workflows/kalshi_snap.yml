name: kalshi-snapshots
on:
  schedule:
    - cron: '7 */4 * * *'        # every 4 hours, free
  workflow_dispatch:
permissions:
  contents: write
concurrency: kalshi-snap
jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python collect_kalshi_snap.py
      - name: Commit
        run: |
          git config user.name "logs-bot"
          git config user.email "logs-bot@users.noreply.github.com"
          git add logs/kalshi_snap
          git diff --cached --quiet || git commit -q -m "kalshi snap $(date -u +%Y%m%dT%H%MZ)"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 7; done
